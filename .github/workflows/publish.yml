name: Build and publish book
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - name: Verify quantum-jump benchmarks
        run: julia --project=. --startup-file=no test/runtests.jl
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.10.18'
          tinytex: true
      - name: Render HTML and PDF
        run: quarto render
      - name: Check chapter links, anchors, citations, figures, and PDF download
        run: python3 scripts/check_book.py
      - uses: actions/upload-artifact@v7
        with:
          name: rendered-book
          path: _site/
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: _site/
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
